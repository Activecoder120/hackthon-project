name: Deploy campus guide to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test
      - run: npm run build
        env:
          DEPLOY_BASE_PATH: /hackthon-project/
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
      # Pages must be enabled once in repository settings. GITHUB_TOKEN
      # can deploy an enabled site but cannot enable Pages for a repository.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
